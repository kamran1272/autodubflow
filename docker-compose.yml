services:
  postgres:
    image: postgres:16-alpine
    container_name: autodubflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: autodubflow
      POSTGRES_USER: autodubflow
      POSTGRES_PASSWORD: autodubflow
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: autodubflow-redis
    restart: unless-stopped
    ports:
      - '6379:6379'

  minio:
    image: quay.io/minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: autodubflow-minio
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: autodubflow-api
    depends_on:
      - postgres
      - redis
    env_file:
      - .env
    ports:
      - '4000:4000'

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.worker
    container_name: autodubflow-worker
    depends_on:
      - postgres
      - redis
    env_file:
      - .env

  browser-agent:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.browser-agent
    container_name: autodubflow-browser-agent
    depends_on:
      - redis
    env_file:
      - .env
    ports:
      - '3001:3001'

volumes:
  postgres_data:
  minio_data:
